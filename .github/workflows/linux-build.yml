name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev liburing-dev perl pkg-config

      - name: Configure
        run: ./configure

      - name: Build
        run: make BUILD_JOBS=2 ROCKSDB_JOBS=2

      - name: Test
        run: make test

      - name: Verify production configuration
        run: etc/scripts/production_check.sh --repository
