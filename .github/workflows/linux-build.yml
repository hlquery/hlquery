name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl php-cli zlib1g-dev libssl-dev liburing-dev

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: php tests/php/run_all.php
