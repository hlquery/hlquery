name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches source version
        run: |
          source_version="$(sh src/version.sh | sed 's/^hlquery-//')"
          test "v${source_version}" = "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev liburing-dev perl pkg-config

      - name: Build and test portable binaries
        run: |
          ./configure --skip-tests
          make PORTABLE_BUILD=1 BUILD_JOBS=2 ROCKSDB_JOBS=2
          make PORTABLE_BUILD=1 test

      - name: Stage artifact
        run: |
          make PORTABLE_BUILD=1 DESTDIR="$PWD/stage" install-system
          tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH:-0}" \
              --owner=0 --group=0 --numeric-owner \
              -C stage -czf "hlquery-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" .
          sha256sum "hlquery-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" > SHA256SUMS

      - uses: anchore/sbom-action@v0
        with:
          path: stage
          format: spdx-json
          output-file: hlquery.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: hlquery-${{ github.ref_name }}-linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: |
            hlquery-${{ github.ref_name }}-linux-x86_64.tar.gz
            SHA256SUMS
            hlquery.spdx.json
