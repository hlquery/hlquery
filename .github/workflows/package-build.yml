name: Package Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debian:
    name: Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libssl-dev dpkg-dev fakeroot cmake git

      - name: Build .deb package
        working-directory: etc/package-builder
        env:
          GIT_REPO: ${{ github.workspace }}
          BUILD_MODE: release
        run: |
          ./build.sh --type deb --version 1.0.0 --release "$GITHUB_RUN_NUMBER" --git-version "$GITHUB_SHA"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: hlquery-deb
          path: etc/package-builder/dist/*.deb

  rpm:
    name: RPM package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libssl-dev cmake git rpm

      - name: Build .rpm package
        working-directory: etc/package-builder
        env:
          GIT_REPO: ${{ github.workspace }}
          BUILD_MODE: release
        run: |
          ./build.sh --type rpm --version 1.0.0 --release "$GITHUB_RUN_NUMBER" --git-version "$GITHUB_SHA"

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: hlquery-rpm
          path: etc/package-builder/dist/*.rpm
