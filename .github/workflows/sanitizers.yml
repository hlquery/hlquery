name: Sanitizers

on:
  pull_request:
  push:
    branches: [main, unstable, "1.0"]
  schedule:
    - cron: "41 3 * * 2"

jobs:
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        build_mode: [sanitize, thread-sanitize]
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev liburing-dev perl pkg-config

      - name: Configure
        run: ./configure --skip-tests

      - name: Build
        run: make BUILD_MODE=${{ matrix.build_mode }} BUILD_JOBS=2 ROCKSDB_JOBS=2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: make BUILD_MODE=${{ matrix.build_mode }} test
