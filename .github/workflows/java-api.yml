name: Java API build/test

on:
  push:
    paths:
      - ".github/workflows/java-api.yml"
      - "etc/api/java/**"
      - "etc/api/tests/**"
      - "src/**"
      - "include/**"
      - "make/**"
      - "configure"
      - "Makefile"
      - "makefile"
  pull_request:
    paths:
      - ".github/workflows/java-api.yml"
      - "etc/api/java/**"
      - "etc/api/tests/**"
      - "src/**"
      - "include/**"
      - "make/**"
      - "configure"
      - "Makefile"
      - "makefile"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install hlquery build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl curl

      - name: Build hlquery
        run: |
          ./configure --skip-tests
          make -j2

      - name: Start hlquery
        run: |
          set -euo pipefail
          ./run/hlquery start

          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:9200/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "hlquery did not become ready in time"
          ./run/hlquery status || true
          tail -n 200 run/logs/hlquery.log || true
          exit 1

      - name: Java API make test
        env:
          HLQUERY_BASE_URL: http://localhost:9200
        run: make -C etc/api/java test

      - name: Stop hlquery
        if: always()
        run: |
          ./run/hlquery stop || ./run/hlquery kill || true
