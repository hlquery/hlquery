name: Docker build

on:
  push:
    paths:
      - "etc/docker/**"
      - "src/**"
      - "include/**"
      - "make/**"
      - "configure"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "etc/docker/**"
      - "src/**"
      - "include/**"
      - "make/**"
      - "configure"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: etc/docker
          push: false
          tags: hlquery:ci
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_JOBS=2
