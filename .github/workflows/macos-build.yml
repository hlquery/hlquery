name: macOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install cmake make pkg-config openssl@3

      - name: Configure Homebrew paths
        run: |
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-isystem ${OPENSSL_PREFIX}/include ${CPPFLAGS}" >> "$GITHUB_ENV"
          echo "EXTRA_LDFLAGS=-L${OPENSSL_PREFIX}/lib ${EXTRA_LDFLAGS}" >> "$GITHUB_ENV"

      - name: Configure
        run: ./configure

      - name: Build
        run: gmake BUILD_JOBS=2 ROCKSDB_JOBS=2

      - name: Test
        run: gmake test
