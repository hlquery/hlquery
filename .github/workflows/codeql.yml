name: CodeQL

on:
  push:
    branches: [main, unstable, "1.0"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev liburing-dev perl pkg-config

      - name: Build
        run: |
          ./configure --skip-tests
          make BUILD_JOBS=2 ROCKSDB_JOBS=2

      - uses: github/codeql-action/analyze@v3

