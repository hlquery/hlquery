# IP ALLOW FILTERING
#
# Configure IP address filtering to restrict access to the server.
# Supports multiple IP addresses, CIDR subnets, hostnames (with DNS resolution),
# wildcard hostnames, and wildcard "*" for allow all.
#
# DNS Resolution:
#   - DNS is ONLY enabled if hostnames are configured (not for "*" or IP-only configs)
#   - Regular hostnames are resolved at startup and cached
#   - Wildcard hostnames (*.domain.com) use reverse DNS on connection (cached)
#   - Client connections using hostnames are automatically resolved (cached)
#   - When DNS is enabled, logs show both IP and hostname: "IP (hostname)"
#   - When DNS is disabled (IP-only or "*"), logs show only IP addresses
#
# allow: Comma-separated list of allowed IP addresses, CIDR ranges, and/or hostnames
#          - Use "*" to allow all IPs (default, no DNS resolution)
#          - Use specific IPs: "192.168.1.1,10.0.0.5" (no DNS resolution)
#          - Use CIDR subnets: "192.168.1.0/24,10.0.0.0/16" (no DNS resolution)
#          - Use hostnames: "api.example.com" (DNS resolved at startup, cached)
#          - Use wildcard hostnames: "*.example.com" (reverse DNS on connection, cached)
#          - Mix all types: "192.168.1.1,192.168.1.0/24,api.example.com,*.internal.com"
#
# deny:  Comma-separated list of denied IP addresses, CIDR ranges, and/or hostnames
#        - Deny rules override allow rules (even if allow="*")
#
# Examples:
#
#   <host allow="*">                                   # Allow all IPs (no DNS)
#   <host allow="127.0.0.1">                           # Only localhost (no DNS)
#   <host allow="192.168.1.1,10.0.0.5">                # Specific IPs (no DNS)
#   <host allow="192.168.1.0/24">                      # Entire subnet (no DNS)
#   <host allow="api.hlquery.com">                     # Hostname (DNS at startup)
#   <host allow="*.hlquery.com">                       # Wildcard (reverse DNS on connect)
#   <host allow="192.168.1.0/24,*.hlquery.com">        # Mix CIDR and wildcard
#   <host allow="192.168.1.1,10.0.0.0/16">             # Mix all types
#   <host deny="spam.hlquery.com">                     # Block a specific hostname
#
# Note: DNS cache improves performance by avoiding repeated lookups.
#       Hostnames in config are resolved at startup. Client hostnames are resolved on connection.
#
# IMPORTANT: If <host> or <allow> tags are not provided or allow is empty, ALL connections are DENIED.
#            You must explicitly set allow="*" to allow all IPs, or specify allowed IPs/hostnames.

<host allow="localhost">
<host allow="192.168.1.0/24">

# PERFORMANCE SETTINGS
#
# Tune these values once the collection is fully indexed and running on fast NVMe/SSD media with RocksDB
# configured for a generous block cache and background compaction. The defaults below intentionally keep the
# total process thread budget modest so hlquery does not overwhelm small or already-busy systems.
#
# `max_threads` accepts an integer, "auto", or "max".
# `max_threads="auto"` picks a conservative startup budget from CPU count and reduces it further if the
# machine is already under heavy load or has an unusually high total system thread count.
# `max_threads="max"` does NOT inspect live system load. It resolves to hlquery's built-in ceiling
# (currently 24 threads in this build), then other subsystems budget themselves within that cap.
# If you want a fixed lower cap for busy machines, set an explicit number such as 16.
#
# Thread pool counts accept integers or "max" for automatic sizing. With "max", hlquery distributes the
# remaining budget across its internal pools after reserving space for RocksDB and core background work.

<performance
     max_threads="auto"
#     max_threads="max"
     queue_size="32768"
     max_candidates="1500"
     snippet_step="20"
     max_connections="8192"
     search_pool_threads="max"
     http_pool_threads="max"
     write_pool_threads="max"
     management_pool_threads="4">

<indexing
     # Enable wildcard matching in collection-name search (colsearch / GET /collections?pattern=...)
     enable_collection_wildcards="true"
     # Limit how many documents a single background pass will handle.
     # Larger batches use more RAM but finish loading faster; keep within a few thousand for stability.
     batch_size="5000"
     # The paging cap that bounds how many documents we count before splitting into another background job.
     # Raise this on beefy systems so we finish large collections in a single sweep.
     max_documents="2000000">

# BEGIN MERGED: database.conf
# RocksDB STORAGE ENGINE CONFIGURATION
#
# The RocksDB engine is the core storage backend for hlquery. It provides
# high-performance write-optimized storage with automatic compaction.
#
# All size values support units: KB, MB, GB, TB (case-insensitive)
# Examples: "16MB", "256KB", "1GB", "512" (bytes if no unit)

<database
    # MemTable Settings
    # memtable_size: Size of each in-memory table before flushing to disk
    #                Larger values = more writes before flush, but more memory usage
    #                Default: 16MB (lightweight configuration for minimal memory footprint)
    memtable_size="128MB"
    
    # max_memtables: Maximum number of memtables allowed before forcing flush
    #               More memtables = better write throughput, but more memory
    #               Default: 2 (minimal for lightweight operation)
    max_memtables="8"
    
    # SSTable Settings
    # sstable_size: Target size for sorted string tables on disk
    #               Larger SSTables = fewer files, but slower compaction
    #               Default: 128MB (reduced for lightweight operation)
    sstable_size="256MB"
    
    # max_levels: Maximum number of RocksDB levels
    #             More levels = better space efficiency, but more compaction overhead
    #             Default: 7 (reduced for lighter memory usage)
    max_levels="9"
    
    # level0_files: Number of files in level 0 before triggering compaction
    #              More files = better write performance, but slower reads
    #              Default: 4 (reduced for lighter memory)
    level0_files="6"
    
    # Compression Settings
    # enable_compression: Enable compression for SSTables
    #                    Reduces disk usage at cost of CPU
    #                    Default: true
    enable_compression="true"
    
    # compression_level: Compression level (0-9, where 9 is maximum)
    #                    Higher = better compression but more CPU
    #                    Default: 6 (balanced)
    compression_level="1"
    
    # Background Operations
    # enable_compaction: Enable automatic background compaction
    #                   Compaction merges and optimizes SSTables
    #                   Default: true
    enable_compaction="true"
    
    # compaction_threads: Number of background threads for compaction
    #                    More threads = faster compaction, but more CPU/memory
    #                    Default: 1 (single thread for lightweight operation)
    #                    Keep this at 1 to prevent thread explosion (0 is not allowed by validation)
    compaction_threads="8"
    
    # Directory Paths
    # data_dir: Base directory for RocksDB data storage
    #          Default: HLQUERY_DATA_DIR/storage
    # data_dir="/var/lib/hlquery/storage"
    
    # wal_dir: Write-Ahead Log directory
    #         Default: data_dir/wal
    # wal_dir="/var/lib/hlquery/storage/wal"
    
    # sstable_dir: Directory for SSTable files
    #             Default: data_dir/sstables
    # sstable_dir="/var/lib/hlquery/storage/sstables"
    
    # Fallback Directories (optional)
    # Used if primary directories fail or become unavailable
    # fallback_data_dir=""
    # fallback_wal_dir=""
    # fallback_sstable_dir=""
    
    # Performance Tuning
    # enable_bloom_filter: Enable Bloom filters for faster lookups
    #                     Bloom filters reduce disk I/O for non-existent keys
    #                     Default: true
    enable_bloom_filter="true"
    
    # bloom_filter_bits: Bits per key for Bloom filter
    #                   More bits = fewer false positives, but more memory
    #                   Default: 8 (reduced for lighter memory)
    bloom_filter_bits="16"
    
    # enable_block_cache: Enable block-level caching
    #                    Caches frequently accessed data blocks in memory, which benefits NVMe/SSD workloads.
    #                    Default: true
    enable_block_cache="true"
    
    # block_cache_size: Size of block cache in memory
    #                  Larger cache = better read performance, but more memory.
    #                  On machines with ≥32GB RAM and NVMe, bump this to 3–4GB to keep hot SSTables cached.
    block_cache_size="4096MB"
    
    # Write Flow Control (RocksDB-style)
    # level0_slowdown_writes_trigger: Slowdown writes when L0 reaches this many files
    #                                 Prevents too many L0 files from accumulating
    #                                 Default: 20
    level0_slowdown_writes_trigger="40"
    
    # level0_stop_writes_trigger: Stop writes completely when L0 reaches this many files
    #                            Emergency brake to prevent compaction from falling behind
    #                            Default: 36
    level0_stop_writes_trigger="60"
    
    # min_write_buffer_number_to_merge: Minimum memtables to merge before flush
    #                                   Higher values = larger flushes = fewer SSTables
    #                                   Default: 1
    min_write_buffer_number_to_merge="2"
    
    # Compaction Strategy
    # compaction_style: Compaction algorithm to use
    #                  Options: "level" (default), "universal", "fifo"
    #                  - level: Traditional RocksDB leveled compaction (best for reads)
    #                  - universal: Merge all files at once (better write amp)
    #                  - fifo: Delete old files (time-series data)
    #                  Default: level
    compaction_style="level"
    
    # max_bytes_for_level_base: Maximum bytes for level 1
    #                           Level N size = base * multiplier^(N-1)
    #                           Default: 256MB
    max_bytes_for_level_base="1GB"
    
    # max_bytes_for_level_multiplier: Size multiplier between levels
    #                                Each level is this many times larger than previous
    #                                Default: 10 (L2 = 10*L1, L3 = 10*L2, etc.)
    max_bytes_for_level_multiplier="12"
    
    # Background Thread Limits
    # max_background_jobs: Total background threads (flushes + compactions)
    #                     This is the total thread pool size for RocksDB background operations
    #                     Set to "max" to smartly use available thread budget.
    #                     Default: 2
    max_background_jobs="max"
    
    # max_background_flushes: Maximum concurrent memtable flushes
    #                        More = faster flush but more I/O
    #                        Set to "max" for auto-calculation.
    #                        Must be <= max_background_jobs
    max_background_flushes="max"
    
    # max_background_compactions: Maximum concurrent compaction threads
    #                            More = faster compaction but more CPU/I/O
    #                            Set to "max" for auto-calculation.
    #                            max_background_flushes + max_background_compactions <= max_background_jobs
    max_background_compactions="max"
    
    # WAL (Write-Ahead Log) Options
    # wal_sync_mode: WAL sync behavior
    #               Options: "none" (fast, risk data loss), "normal" (fsync per write),
    #                       "full" (fsync + sync directory)
    #               Default: normal
    wal_sync_mode="none"
    
    # wal_bytes_per_sync: Sync WAL to disk every N bytes
    #                    0 = sync every write (slowest, safest)
    #                    Large values = batch syncs (faster, small data loss window)
    #                    Default: 0
    wal_bytes_per_sync="64MB"
    
    # max_total_wal_size: Maximum total size of all WAL files
    #                    When exceeded, oldest memtables are flushed
    #                    Default: 0 (unlimited)
    max_total_wal_size="8GB"
    
    # wal_ttl_seconds: WAL file time-to-live in seconds
    #                 Old WAL files are deleted after this time
    #                 Default: 0 (keep until after flush)
    wal_ttl_seconds="0"
    
    # wal_size_limit_mb: Maximum size of a single WAL file in MB
    #                   New WAL file created when limit reached
    #                   Default: 0 (unlimited)
    wal_size_limit_mb="0"
    
    # Block and SSTable Options
    # block_size: Size of data blocks in SSTables
    #            Smaller = more granular reads, larger = better compression
    #            Default: 4KB
    block_size="4KB"
    
    # block_restart_interval: Number of keys between restart points
    #                        Lower = faster random access, higher = better compression
    #                        Default: 16
    block_restart_interval="16"
    
    # File Management
    # max_open_files: Maximum number of open file descriptors
    #                -1 = unlimited (may hit OS limit)
    #                Lower values save memory but may slow reads
    #                Default: -1
    max_open_files="-1"
    
    # delete_obsolete_files_period_micros: How often to check for obsolete files (microseconds)
    #                                     Lower = more frequent cleanup but more overhead
    #                                     Default: 21600000000 (6 hours)
    delete_obsolete_files_period_micros="21600000000"
    
    # table_cache_numshardbits: Number of shards for table cache
    #                          2^N shards to reduce lock contention
    #                          Higher = less contention but more memory overhead
    #                          Default: 6 (64 shards)
    table_cache_numshardbits="6"
    
    # I/O and Performance Options
    # use_direct_reads: Bypass OS page cache for reads (O_DIRECT)
    #                  May improve performance with large datasets
    #                  Default: false
    use_direct_reads="false"
    
    # use_direct_io_for_flush_and_compaction: Use O_DIRECT for compaction I/O
    #                                        Reduces OS cache pollution
    #                                        Default: false
    use_direct_io_for_flush_and_compaction="false"
    
    # allow_mmap_reads: Use mmap for reading SSTable files
    #                  Can be faster but uses more virtual memory
    #                  Default: false
    allow_mmap_reads="true"
    
    # allow_mmap_writes: Use mmap for writing SSTable files
    #                   Usually not recommended (risk of corruption)
    #                   Default: false
    allow_mmap_writes="false"
    
    # advise_random_on_open: Tell OS to expect random access pattern
    #                       May improve read performance
    #                       Default: true
    advise_random_on_open="true"
    
    # Paranoid Checks
    # paranoid_checks: Enable paranoid safety checks
    #                 Slower but catches corruption early
    #                 Default: true
    paranoid_checks="true"
    
    # verify_checksums_in_compaction: Verify checksums during compaction
    #                                Catches corruption but adds overhead
    #                                Default: true
    verify_checksums_in_compaction="true"
    
    # Statistics and Monitoring
    # enable_statistics: Collect detailed performance statistics
    #                   Small overhead but useful for monitoring
    #                   Default: false
    enable_statistics="true"
    
    # stats_dump_period_sec: How often to dump stats to LOG file (seconds)
    #                       0 = never dump stats
    #                       Default: 600 (10 minutes)
    stats_dump_period_sec="600"
    
    # Advanced Write Options
    # enable_pipelined_write: Pipeline writes for better throughput
    #                        Experimental feature, may improve write performance
    #                        Default: false
    enable_pipelined_write="false"
    
    # unordered_write: Allow out-of-order writes for better concurrency
    #                 May improve write throughput in some workloads
    #                 Default: false
    unordered_write="false"
    
    # manual_wal_flush: Disable automatic WAL flush (manual control)
    #                  For advanced users who want explicit flush control
    #                  Default: false
    manual_wal_flush="true"
    
    # Compression Per Level
    # compression_per_level: Different compression for each level (comma-separated)
    #                       Options: none, snappy, zlib, lz4, zstd
    #                       Example: "none,none,snappy,snappy,zlib,zlib,zlib"
    #                       Empty = use compression_level for all levels
    #                       Default: "" (use global compression_level)
    compression_per_level=""
    
    # Rate Limiting
    # rate_limit_bytes_per_sec: Limit compaction/flush I/O rate (bytes per second)
    #                          0 = unlimited
    #                          Prevents compaction from overloading I/O
    #                          Default: 0
    rate_limit_bytes_per_sec="0"
    
    # rate_limiter_refill_period_ms: How often to refill rate limiter tokens (milliseconds)
    #                               Default: 100
    rate_limiter_refill_period_ms="100">

# END MERGED: database.conf

# IP FILTER / DNS CACHE
# dns_cache_size: Max entries for DNS and reverse DNS caches
#                 Default: 1024 (see config.h)

<ip_filter dns_cache_size="1024">

# CONFIGURATION INCLUDES
#
# Include additional configuration files
# All configuration files are loaded through hlquery.conf
# These files are processed in order and merged into the main configuration
#
# Configuration sections:
#   - Runtime module loading and module-specific configuration
#   - Authentication and user authorization
#   - Distributed node/peer link definitions
#   - Advanced RocksDB storage engine configuration (includes data_dir, compression, etc.)
#   - Search algorithm and query processing configuration
#

# AUTH SECTION
# AUTHENTICATION CONFIGURATION
#
# The authentication system provides API key-based access control for hlquery.
# Users authenticate using tokens (API keys) that can be passed in request headers
# or as query parameters.
#
# When authentication is disabled, all API endpoints are accessible without tokens.
# When enabled, all API requests (except health checks) require valid authentication.

<auth
    # enabled: Enable or disable authentication system
    #          When false, all API endpoints are accessible without authentication
    #          When true, all API requests require valid user tokens
    #          Default: false (authentication disabled)
    enabled="false">

# USER ACCOUNTS
#
# Each user account defines an API key and associated permissions.
# Users authenticate by providing their token in API requests.
# Only the token is required for authentication.
# The username is optional and used only for user management/identification.

# Example: Minimal user (only token required)
# <user token="your_api_key_here" flags="user">

# Example: User with optional name for identification
# <user name="api_client_1" token="your_api_key_here" flags="user">

# Example: Admin user
# <user name="admin" token="your_admin_key_here" flags="admin">

# Current user account (minimal - only token required)

<user 
    # token: API key/token for authentication (REQUIRED)
    #        Can be plain text or SHA-256 hash (for backward compatibility)
    #        Must be unique across all users
    #        This is the only field required for authentication
    token="XBi0exfFbWo7crXhFbkF"
    
    # flags: User permissions and access level
    #        Options: "admin", "user", or comma-separated list
    #        admin = Full system access, can manage users and system settings
    #        user = Standard user access, can query and manage own data
    #        Default: "user"
    #        Example: "admin" or "user" or "admin,user"
    flags="admin">

# SEARCH SECTION
# SEARCH ALGORITHM SELECTION
#
# Choose the base ranking algorithm. Options:
# - bm25: Standard BM25 (Robertson et al., 1994)
# - bm25+: BM25+ with lower bound delta (Lv & Zhai, 2009) [DEFAULT]
# - tfidf: Classic TF-IDF scoring
# - hybrid: Combination of multiple algorithms

<search
     algorithm="bm25+"
     fuzzy="false"
     max_edit_distance="1">

# UNIFIED RANKING PARAMETERS
#
# All ranking algorithm parameters in one section. Each algorithm reads only
# the parameters it needs. Parameters not used by the selected algorithm are ignored.
#
# BM25/BM25+ parameters:
#   k1: Term frequency saturation parameter [default: 1.2, range: 0.1-10.0]
#       Higher values = term frequency matters more
#   b: Document length normalization parameter [default: 0.75, range: 0.0-1.0]
#       Higher values = more length normalization
#   delta: Lower bound for term frequency (BM25+ only) [default: 1.0, range: 0.0-10.0]
#          Prevents negative scores for very long documents
#
# TF-IDF / IDF parameters:
#   idf_smooth: Smoothing factor for IDF calculation [default: 1.0]
#               Prevents division by zero for terms in all documents
#   idf_mode: IDF formula mode - "legacy" or "smooth" [default: "legacy"]
#             - legacy: classic BM25 probabilistic IDF with optional clamp
#             - smooth: log1p-smoothed IDF for less harsh frequent-term flattening
#   idf_clamp_negative: Clamp negative legacy IDF values to 0 [default: true]
#   normalize: Normalize document vectors [default: true]
#              Normalizes scores to prevent bias toward longer documents
#
# Hybrid parameters:
#   bm25_weight: Weight for BM25 component [default: 0.7, range: 0.0-1.0]
#   tfidf_weight: Weight for TF-IDF component [default: 0.3, range: 0.0-1.0]
#                 Sum of weights should equal 1.0
#
# Note: Each algorithm automatically reads only the parameters it needs.
#       For example, BM25+ reads k1, b, and delta; TF-IDF reads idf_smooth and normalize.

<params
     k1="1.35"
     b="0.72"
     delta="0.80"
     idf_smooth="1.0"
     idf_mode="legacy"
     idf_clamp_negative="true"
     normalize="true"
     bm25_weight="0.7"
     tfidf_weight="0.3"
     url_token_boost="1.35"
     url_tld_weight="0.08"
     title_like_boost="2.15"
     tag_like_boost="1.45"
     exact_match_boost="2.25"
     title_exact_boost="4.00"
     proximity_boost_scale="1.25"
     proximity_boost_max="2.50">

# HYBRID MERGE AND RERANK SETTINGS
#
# Controls lexical + vector fusion behavior.
# Safe defaults preserve historical behavior (linear merge, no normalization, no rerank).
#
# method: "linear" or "rrf" [default: "linear"]
# normalize_component_scores: normalize lexical/vector components before linear merge [default: false]
# normalization_method: "minmax" or "zscore" [default: "minmax"]
# rrf_k: RRF constant when method="rrf" [default: 60]
#
# dynamic_alpha: Automatically pick alpha by query length buckets [default: false]
# short_query_terms: max terms considered "short" [default: 2]
# long_query_terms: min terms considered "long" [default: 6]
# alpha_short: alpha for short queries [default: 0.35]
# alpha_medium: alpha for medium queries [default: 0.50]
# alpha_long: alpha for long queries [default: 0.70]
#
# vector_candidate_limit: max docs evaluated in brute-force vector stage [default: 1000]
#
# rerank_enabled: rerank top-K hybrid hits with normalized feature combiner [default: false]
# rerank_top_k: top-K slice for reranking [default: 100]
# rerank_lexical_weight: rerank lexical weight [default: 0.55]
# rerank_vector_weight: rerank vector weight [default: 0.45]
# rerank_coverage_boost: additive boost for hits present in both stages [default: 0.10]

<hybrid_merge
     method="linear"
     normalize_component_scores="true"
     normalization_method="minmax"
     rrf_k="60"
     dynamic_alpha="true"
     short_query_terms="2"
     long_query_terms="6"
     alpha_short="0.25"
     alpha_medium="0.40"
     alpha_long="0.55"
     vector_candidate_limit="2000"
     rerank_enabled="true"
     rerank_top_k="100"
     rerank_lexical_weight="0.68"
     rerank_vector_weight="0.32"
     rerank_coverage_boost="0.18">

# ADVANCED SEARCH IMPROVEMENTS (Apply to all algorithms)

# ADAPTIVE K1 IMPROVEMENT (Improvement #1)
# 
# Automatically adjusts k1 based on query length for optimal relevance
# Based on "An Exploration of BM25's Parameters" (Lv & Zhai, 2011)
#
# enabled: Enable adaptive k1 adjustment
# short_k1: k1 value for short queries (1-2 terms) [default: 1.8]
# medium_k1: k1 value for medium queries (3-5 terms) [default: 1.2]
# long_k1: k1 value for long queries (6+ terms) [default: 0.9]
# short_threshold: Maximum terms for "short" query [default: 2]
# medium_threshold: Maximum terms for "medium" query [default: 5]

<adaptive_k1
     enabled="true"
     short_k1="1.65"
     medium_k1="1.30"
     long_k1="1.00"
     short_threshold="2"
     medium_threshold="5">

# POSITION-BASED BOOSTING (Improvement #2)
#
# Boost documents where query terms appear early (strong relevance signal)
# Uses position information already stored in index
#
# enabled: Enable position-based boosting
# max_boost: Maximum boost multiplier for early positions [default: 1.5]
# decay_factor: How quickly boost decays with position [default: 10.0]
# Formula: boost = 1.0 + (max_boost - 1.0) / (1.0 + position / decay_factor)

<position_boost
     enabled="true"
     max_boost="1.65"
     decay_factor="8.0">

# BM25F - FIELD-AWARE BM25 (Improvement #3)
#
# Different k1 values per field type for more nuanced scoring
# Title matches are typically more important than content matches
#
# enabled: Enable field-specific k1 values
# title_k1: k1 for title field [default: 1.5]
# content_k1: k1 for content field [default: 1.2]
# field_k1: k1 for other fields [default: 1.0]

<bm25f
     enabled="true"
     title_k1="1.65"
     content_k1="1.15"
     field_k1="1.05">

# COLLECTION-SPECIFIC BM25 PARAMETERS (Improvement #4)
#
# Allow different BM25 parameters per collection
# Collections have different characteristics (news vs technical docs)
#
# enabled: Enable collection-specific parameter overrides
# default_k1: Default k1 if collection doesn't specify [default: 1.2]
# default_b: Default b if collection doesn't specify [default: 0.75]
# default_delta: Default delta if collection doesn't specify [default: 1.0]

<collection_params
     enabled="true"
     default_k1="1.2"
     default_b="0.75"
     default_delta="1.0">

# QUERY-DEPENDENT K1 AND B PARAMETERS (Improvement #5)
#
# Make k1 and b functions of query length or entropy:
# - Short, head queries: smaller b (less length penalty), larger k1 (tf matters)
# - Long, verbose queries: larger b, smaller k1
#
# This is still "inside" the formula, just parameterized on query stats.
# The adaptive_k1 already handles k1 adjustment, this handles b adjustment.
#
# enabled: Enable query-dependent b adjustment
# short_b: b value for short queries [default: 0.65] - less length penalty
# medium_b: b value for medium queries [default: 0.75]
# long_b: b value for long queries [default: 0.80] - more length normalization

<query_dependent_b
     enabled="true"
     short_b="0.60"
     medium_b="0.72"
     long_b="0.82">

# PIVOT-BASED DOCUMENT LENGTH NORMALIZATION (Improvement #6)
#
# More robust normalization using pivot-based approach
# Based on "Pivoted Document Length Normalization" (Singhal et al., 1996)
#
# enabled: Enable pivot-based normalization
# pivot: Pivot value for normalization [default: 0.25]
# Formula: norm = (1 - pivot) + pivot * (doc_length / avg_length)

<pivot_norm
     enabled="true"
     pivot="0.25">

# TERM-SPECIFIC NORMALIZATION (Improvement #7)
#
# Different normalization for rare vs common terms
# Rare terms benefit more from length normalization
#
# enabled: Enable term-specific b adjustment
# rare_term_b: b value for rare terms (high IDF) [default: 0.8]
# common_term_b: b value for common terms (low IDF) [default: 0.75]
# rare_term_idf_threshold: IDF threshold for "rare" term [default: 2.0]

<term_specific_norm
     enabled="true"
     rare_term_b="0.84"
     common_term_b="0.70"
     rare_term_idf_threshold="1.8">

# QUERY TERM IMPORTANCE WEIGHTING (Improvement #8)
#
# Weight query terms by their IDF or importance
# Not all query terms are equally important
#
# enabled: Enable query term importance weighting
# method: Weighting method - "idf" (use IDF) or "equal" (all equal) [default: "idf"]
# min_weight: Minimum weight for any term [default: 0.5]
# max_weight: Maximum weight for any term [default: 2.0]

<term_importance
     enabled="true"
     method="idf"
     min_weight="0.45"
     max_weight="2.35">

# PHRASE MATCHING BONUS (Improvement #9)
#
# Bonus for documents containing exact phrase matches
# Phrase matches are strong relevance signals
#
# enabled: Enable phrase matching bonus
# bonus: Score bonus for exact phrase match [default: 0.5]
# min_phrase_length: Minimum words to consider a phrase [default: 2]

<phrase_bonus
     enabled="true"
     bonus="0.8"
     min_phrase_length="2">

# EXACT MATCH BONUS (Improvement #10)
#
# Bonus for documents matching the full query exactly
# Exact matches are often highly relevant
#
# enabled: Enable exact match bonus
# bonus_multiplier: Score multiplier when all terms match [default: 1.2]
# min_terms: Minimum terms required for exact match bonus [default: 2]

<exact_match
     enabled="true"
     bonus_multiplier="1.35"
     min_terms="2">

# FIELD BOOSTING (Existing feature, configurable)
#
# Boost matches in different fields (title vs content)
# These work alongside BM25F for comprehensive field-aware scoring
#
# title_boost: Boost multiplier for title matches [default: 2.0]
# content_boost: Boost multiplier for content matches [default: 1.0]
# field_boost: Boost multiplier for other field matches [default: 1.5]

<field_boost
     title_boost="2.35"
     content_boost="1.0"
     field_boost="1.35">

# PROXIMITY SCORING (Improvement #11)
#
# Boost documents where query terms appear close together
# Proximity is a strong relevance signal
#
# enabled: Enable proximity scoring
# max_distance: Maximum term distance to consider [default: 10]
# boost_per_distance: Boost per unit distance reduction [default: 0.1]
# max_proximity_boost: Maximum boost from proximity [default: 0.5]

<proximity
     enabled="true"
     max_distance="8"
     boost_per_distance="0.14"
     max_proximity_boost="0.70">

# QUERY EXPANSION WITH PSEUDO-RELEVANCE FEEDBACK (Improvement #12)
#
# Expand queries with top-ranked terms from initial results
# Can improve recall for ambiguous queries
#
# enabled: Enable query expansion
# top_docs: Number of top docs to extract terms from [default: 5]
# expansion_terms: Number of terms to add [default: 3]
# expansion_weight: Weight for expanded terms [default: 0.5]

<query_expansion
     enabled="false"
     top_docs="5"
     expansion_terms="3"
     expansion_weight="0.5">

# DOCUMENT QUALITY SIGNALS (Improvement #13)
#
# Integrate document-level quality signals
# Quality can improve ranking beyond text matching
#
# enabled: Enable quality signals
# freshness_enabled: Enable time-decay freshness boost
# freshness_half_life_days: Days for freshness score to halve [default: 30]
# max_freshness_boost: Maximum boost from freshness [default: 0.3]

<quality_signals
     enabled="false"
     freshness_enabled="false"
     freshness_half_life_days="30"
     max_freshness_boost="0.3">

# TIME-DECAY FOR FRESHNESS 
#
# Boost recent documents with time-decay factor
# Freshness matters for many queries
#
# enabled: Enable time-decay freshness
# half_life_days: Days for freshness score to halve [default: 30]
# max_boost: Maximum boost from freshness [default: 0.3]
# use_timestamp: Use document timestamp field if available [default: true]

<time_decay
     enabled="true"
     half_life_days="45"
     max_boost="0.18"
     use_timestamp="true">

# TEMPORAL BM25++ - RECENCY-BASED SCORING (Improvement #16)
#
# Temporal BM25++ improves freshness by giving higher weight to recently-added documents
# and recently-updated term frequencies. This becomes a temporal BM25++, improving freshness.
#
# Based on research showing that "when something participates affects results" - 
# temporal signals are important for information retrieval.
#
# OPTIMIZED DEFAULTS: Balanced recency boost that improves recent documents without
# being too aggressive. Documents decay smoothly over time with moderate boost.
#
# IMPORTANT: Document timestamps are automatically refreshed when documents are updated,
# so updated documents get a recency boost even if they were originally old. This ensures
# that frequently-updated content (like documentation, wikis, etc.) maintains relevance.
# When a document is updated, its timestamp is reset to the current time, effectively
# "resetting" the time decay so the document gets treated as fresh again.
#
# enabled: Enable temporal BM25++ scoring [default: true]
# recency_weight: Weight for recency component (0.0-1.0) [default: 0.25]
#   - Higher values give more weight to recent documents
#   - 0.25 = moderate boost (up to 5% boost for very recent docs)
#   - Optimized for balanced relevance + freshness (improves recent docs without overwhelming)
#   - Set to 0.0 to disable temporal component
# half_life_days: Days for recency score to halve [default: 45]
#   - Documents older than this get significantly less boost
#   - 45 days = balanced decay (not too fast, not too slow)
#   - Recent docs (0-15 days) get noticeable boost
#   - Medium docs (15-45 days) get moderate boost
#   - Old docs (45+ days) get minimal/no boost
# max_recency_boost: Maximum boost multiplier from recency [default: 1.2]
#   - Recent documents can get up to 20% potential boost (scaled by recency_weight)
#   - With weight=0.25, actual boost is up to 5% for very recent docs
#   - Optimized to improve recent docs without overwhelming relevance
#   - Set to 1.0 to disable boost (only use for normalization)
# use_timestamp: Use document timestamp field if available [default: true]
# normalize_by_age: Normalize scores by document age [default: true]
#   - Older documents get slight penalty, recent get boost
#   - Creates temporal ranking that favors freshness
# temporal_tf_weight: Weight for temporal term frequency updates [default: 0.12]
#   - Terms that appear in recent documents get slightly higher weight
#   - Helps surface emerging topics and trends
#   - Optimized for subtle temporal signal without over-weighting
#
# Formula: score = BM25+_score * (1.0 + recency_boost_amount * recency_weight)
#          where recency_boost_amount = (max_boost - 1.0) * exp(-0.693 * age_days / half_life_days)
#          and recency_factor = exp(-0.693 * age_days / half_life_days)
#
# Example boost values with defaults (max_boost=1.2, weight=0.25):
#   - 0 days old:   +5% boost (1.05x multiplier) = 0.2 * 0.25 = 0.05
#   - 15 days old:  +3% boost (1.03x multiplier) ≈ 0.12 * 0.25 = 0.03
#   - 30 days old:  +1.75% boost (1.0175x multiplier) ≈ 0.07 * 0.25 = 0.0175
#   - 45 days old:  +1% boost (1.01x multiplier) ≈ 0.04 * 0.25 = 0.01 (half-life point)
#   - 90 days old:  +0.25% boost (1.0025x multiplier) ≈ 0.01 * 0.25 = 0.0025
#   - 180+ days old: <0.1% boost (minimal impact)
#
# Note: The boost is moderate by design - it improves recent documents without
# overwhelming relevance. This gives a noticeable but not massive improvement to recent docs.
# Adjust recency_weight (0.0-1.0) to increase/decrease impact.
#
# This integrates temporal signals directly into BM25+ scoring, creating BM25++.

<temporal_bm25
     enabled="true"
     recency_weight="0.12"
     half_life_days="60"
     max_recency_boost="1.12"
     use_timestamp="true"
     normalize_by_age="true"
     temporal_tf_weight="0.06">

# SOPHISTICATED RECENCY DECAY ALGORITHM (Advanced)
#
# Math-heavy recency algorithm with multiple decay models for sophisticated time-based ranking.
# Applies weight-based recency scoring that fades documents over time using advanced mathematical functions.
#
# enabled: Enable sophisticated recency decay [default: true]
# decay_model: Decay function model - "exponential", "sigmoid", "power", "logarithmic", "gaussian" [default: "exponential"]
#   - exponential: Classic exponential decay (fast initial drop, slow tail) - e^(-λt)
#   - sigmoid: S-shaped decay (slow start, fast middle, slow end) - 1 / (1 + e^(k(t-t0)))
#   - power: Power law decay (gradual decline) - (1 + t/τ)^(-α)
#   - logarithmic: Logarithmic decay (very gradual) - 1 / (1 + α*log(1 + t/τ))
#   - gaussian: Gaussian decay (smooth bell curve) - e^(-(t-μ)²/(2σ²))
#
# base_weight: Base weight multiplier for recency (0.0-2.0) [default: 1.0]
#   - 1.0 = no base boost, >1.0 = base boost for all docs, <1.0 = base penalty
#
# max_boost: Maximum boost multiplier for very recent documents (1.0-5.0) [default: 2.0]
#   - Recent docs can get up to this multiplier (e.g., 2.0 = 2x boost)
#
# half_life_days: Half-life in days for exponential/power models [default: 30.0]
#   - Documents older than this get ~50% of maximum boost
#   - Smaller = faster decay, larger = slower decay
#
# decay_rate: Decay rate parameter (λ for exponential, α for power/log) [default: 0.0231]
#   - For exponential: λ = ln(2) / half_life ≈ 0.0231 for 30 days
#   - For power: α controls decay steepness (higher = steeper)
#   - For logarithmic: α controls decay speed (higher = faster)
#
# sigmoid_steepness: Steepness parameter for sigmoid model (k) [default: 0.1]
#   - Higher = steeper transition, lower = more gradual
#
# sigmoid_center: Center point for sigmoid model in days (t0) [default: 30.0]
#   - Point where decay is at 50% (inflection point)
#
# power_exponent: Exponent for power law model (α) [default: 1.5]
#   - Higher = steeper decay, lower = more gradual
#
# gaussian_mean: Mean (peak) for Gaussian model in days (μ) [default: 0.0]
#   - Peak boost occurs at this age (0 = immediate boost)
#
# gaussian_stddev: Standard deviation for Gaussian model in days (σ) [default: 30.0]
#   - Controls width of boost curve (higher = wider)
#
# min_decay_factor: Minimum decay factor (0.0-1.0) [default: 0.1]
#   - Very old documents still get this minimum boost (prevents zero scores)
#
# use_timestamp_field: Use document timestamp field if available [default: true]
#   - Looks for "timestamp", "created_at", "updated_at", "date" fields
#
# normalize_by_collection: Normalize recency scores within collection [default: false]
#   - Scales recency scores to 0-1 range per collection (helps with cross-collection ranking)
#
# query_dependent: Adjust recency weight based on query characteristics [default: false]
#   - Short queries get more recency boost, long queries get less
#
# Formula examples:
#   Exponential: decay = e^(-decay_rate * age_days)
#   Sigmoid: decay = 1 / (1 + e^(sigmoid_steepness * (age_days - sigmoid_center)))
#   Power: decay = (1 + age_days / half_life_days)^(-power_exponent)
#   Logarithmic: decay = 1 / (1 + decay_rate * log(1 + age_days / half_life_days))
#   Gaussian: decay = e^(-(age_days - gaussian_mean)² / (2 * gaussian_stddev²))
#
# Final recency boost: recency_boost = base_weight + (max_boost - base_weight) * decay_factor
# Applied to search weight: final_weight = base_weight * recency_boost
#

<recency_decay
     enabled="true"
     decay_model="exponential"
     base_weight="1.0"
     max_boost="1.35"
     half_life_days="60.0"
     decay_rate="0.0116"
     sigmoid_steepness="0.1"
     sigmoid_center="30.0"
     power_exponent="1.5"
     gaussian_mean="0.0"
     gaussian_stddev="30.0"
     min_decay_factor="0.1"
     use_timestamp_field="true"
     normalize_by_collection="false"
     query_dependent="false">

# QUERY-DEPENDENT IDF WEIGHTING (Improvement #15)
#
# Adjust IDF calculation based on query characteristics
# Different queries may need different IDF handling
#
# enabled: Enable query-dependent IDF
# short_query_idf_boost: IDF boost for short queries [default: 1.1]
# long_query_idf_reduce: IDF reduction for long queries [default: 0.95]

<query_idf
     enabled="false"
     short_query_idf_boost="1.1"
     long_query_idf_reduce="0.95">

# CLUSTER-AWARE BM25+ - ADAPTIVE NORMALIZATION (Improvement #17)
#
# Handles data skew by adjusting IDF by label/cluster skew and normalizing
# term frequency across clusters. This yields cluster-aware BM25+.
#
# High skew causes failures in federated learning (FL), and in IR this means:
# - Corpora with heavy class/topic imbalance distort frequencies
# - You can correct BM25++ by adjusting IDF by label/cluster skew
# - Normalizing term frequency across clusters
#
# enabled: Enable cluster-aware BM25+ [default: true]
# cluster_field: Field name to use for cluster/label detection [default: "cluster"]
#   - Also checks: "label", "category", "class", "topic", "type"
#   - If field not found, uses collection-level clustering
# min_cluster_size: Minimum documents per cluster to consider [default: 5]
#   - Small clusters are ignored to avoid noise
# skew_threshold: Skew threshold to trigger adjustment [default: 0.3]
#   - Skew = std_dev / mean of cluster sizes
#   - Higher values = more aggressive correction
# idf_skew_adjustment: How much to adjust IDF based on cluster skew [default: 0.2]
#   - 0.0 = no adjustment, 1.0 = full adjustment
#   - Terms in skewed clusters get adjusted IDF
# tf_cluster_normalization: Normalize TF across clusters [default: true]
#   - Prevents dominant clusters from overwhelming TF scores
#   - Normalizes TF relative to cluster average
# cluster_idf_boost: Boost IDF for rare terms in small clusters [default: 1.1]
#   - Rare terms in underrepresented clusters get IDF boost
#   - Helps surface diverse content
#
# Formula adjustments:
# - IDF_adj = IDF * (1.0 + idf_skew_adjustment * cluster_skew_factor)
# - TF_norm = TF / (cluster_avg_tf / global_avg_tf)
#
# This creates cluster-aware BM25+ that handles imbalanced corpora.

<cluster_aware
     enabled="true"
     cluster_field="cluster"
     min_cluster_size="5"
     skew_threshold="0.3"
     idf_skew_adjustment="0.2"
     tf_cluster_normalization="true"
     cluster_idf_boost="1.1">

