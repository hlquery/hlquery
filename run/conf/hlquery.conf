# AUTH SECTION
# AUTHENTICATION CONFIGURATION
#
# The authentication system provides API key-based access control for hlquery.
# Users authenticate using tokens (API keys) that can be passed in request headers
# or as query parameters.
#
# When authentication is disabled, all API endpoints are accessible without tokens.
# When enabled, all API requests (except health checks) require valid authentication.

<auth
    # enabled: Enable or disable authentication system
    #          When false, all API endpoints are accessible without authentication
    #          When true, all API requests require valid user tokens
    #          Default: false (authentication disabled)
    enabled="false">

# USER ACCOUNTS
#
# Each user account defines an API key and associated permissions.
# Users authenticate by providing their token in API requests.
# Only the token is required for authentication.
# The username is optional and used only for user management/identification.

# Example: Minimal user (only token required)
# <user token="your_api_key_here" flags="user">

# Example: User with optional name for identification
# <user name="api_client_1" token="your_api_key_here" flags="user">

# Example: Admin user
# <user name="admin" token="your_admin_key_here" flags="admin">

# Do not commit real credentials here. When authentication is enabled, either
# add users through a separately protected configuration file or inject the
# initial administrator token through HLQUERY_ADMIN_TOKEN.


# SEARCH AND MODULE CONFIGURATION
#
# Search tuning lives in search.conf. Runtime modules load from modules.conf.

<adaptive_search
     enabled="false"
     execution_trace="false"
     include_query_text="false"
     allow_request_disable="true"
     expose_capabilities="true">

<include file="search.conf">
<include file="modules.conf">
<include file="links.conf">
