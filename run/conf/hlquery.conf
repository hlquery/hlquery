#############################################################################
#
# LOGGING CONFIGURATION
#
# HLManager provides comprehensive logging capabilities with multiple output
# targets and filtering levels. Logs are essential for monitoring server
# health, debugging issues, and maintaining audit trails.
#
# Available log levels: debug, normal, verbose, critical
# Available log types: *, startup, database, search, network, auth
# Available methods: file, console, syslog

# Global server log - captures all server events and operations
# This is your primary log file for monitoring overall server activity
# Log targets can be relative; relative paths resolve under the configured log dir.
# Default log dir is run/logs in development, or --logdir / HLQUERY_LOG_DIR from configure.

<log
     method="file"
     type="*"
     level="normal"
     target="hlquery.log"
     rotate_size="10MB"
     rotate_interval="daily"
     max_rotated_files="14"
     max_age_days="14">

# Database operations log - RocksDB storage, queries, and transaction tracking
# Essential for monitoring database performance and troubleshooting data issues

<log
     method="file"
     type="database"
     level="normal"
     target="database.log"
     rotate_size="10MB"
     rotate_interval="daily"
     max_rotated_files="7"
     max_age_days="7">

# Query log - tracks ONLY user search queries (not debug logs!)
# Useful for analytics, debugging search issues, and monitoring search patterns
# IMPORTANT: This log only captures logs with type="query" at NORMAL level or above

<log
     method="file"
     type="query"
     level="normal"
     target="queries.log"
     rotate_size="10MB"
     rotate_interval="daily"
     max_rotated_files="3"
     max_age_days="3">

# Distributed links ping events (sent/received/latency)

<log
     method="file"
     type="links"
     level="normal"
     target="links.log"
     rotate_size="10MB"
     rotate_interval="daily"
     max_rotated_files="7"
     max_age_days="7">

# Server identity

<server name="hlquery.local" id="001">

# DEMO MODE
#
# The demo module is activated only when <module name="demo"> is enabled in
# modules.conf. If the module line stays commented out, this tag is ignored.
#
# enabled: master switch inside the module once it is loaded
# message: user-facing text returned in API errors and surfaced by hanalyzer
# block_links: also block runtime /links/connect and /links/disconnect
# block_admin: also block users, keys, flush, and repair
#
#<demo
#    enabled="true"
#    message="Search and browsing are enabled. Write and admin actions are blocked in demo mode."
#    block_links="true"
#    block_admin="true">

