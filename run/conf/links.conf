# Cluster and replication links
#
# Purpose of this file:
# This file defines the optional nodes that hlquery can contact for:
# - distributed search
# - document replication
# - peer health checks and resynchronization
#
# A link definition does not start another hlquery process. The target node
# must already be running and reachable at the configured host and port.
#
# Development defaults:
# - replication to the local read-only replica is enabled below
# - distributed search to the local search peer is enabled below
# - start x7 and x77 before writing through the primary
#
# Production guidance:
# - replace the example addresses and passwords
# - use TLS endpoints when peers expose HTTPS
# - enable only the features used by the deployment
# - keep peer credentials out of publicly readable configuration files
#
# ----------------------------------------------------------------------
# DISTRIBUTED SEARCH PEER
# ----------------------------------------------------------------------
# role="distributed" makes this node eligible for query fan-out.
# It is not used for replication writes.
#
# host       Peer hostname or IP address.
# port       Peer HTTP/HTTPS listener port.
# role       distributed, search, or master.
# passwd     Shared peer credential used for authenticated requests.
#
# For an HTTPS peer, use an endpoint with the https:// scheme where supported
# by the link API, for example: https://search.example.com:9443.

<node
     host="127.0.0.1"
     port="9201"
     role="distributed"
     passwd="local-dev-cluster-token">

# ----------------------------------------------------------------------
# REPLICATION PEER
# ----------------------------------------------------------------------
# role="replica" (also called "slave") marks this node as a replication
# target. The target must be online before enabling synchronous replication.
#
# A failed or unreachable replica can cause write requests to be rejected when
# replication fail-on-error is enabled.

<node
     host="127.0.0.1"
     port="9202"
     role="replica"
     passwd="local-dev-cluster-token">

# ----------------------------------------------------------------------
# REPLICATION SETTINGS
# ----------------------------------------------------------------------
# enabled       Enable replication to nodes with role="replica".
# mode          async, sync_one, quorum, or all.
#               sync_one waits for one replica acknowledgement.
#               quorum waits for a majority of replicas.
#               all waits for every configured replica.
# timeout_ms    Maximum time allowed for a peer replication request.
#
# Local cluster default: enable replication. The primary keeps the replica
# marked dirty while it is offline and performs a full resync when it appears.
# fail_on_error remains false, so an offline development replica does not block
# writes on the primary.

<replication
     enabled="true"
     mode="sync_one"
     timeout_ms="2000"
     fail_on_error="false">

# ----------------------------------------------------------------------
# DISTRIBUTED SEARCH SETTINGS
# ----------------------------------------------------------------------
# enabled       Enable query fan-out to nodes with distributed/search/master
#               roles.
# mode          local_first, remote_only, or strict_remote.
# prefer_local  Prefer the local node before querying peers.
# timeout_ms    Per-peer query timeout.
# persistent    Keep peer connections available between requests.
# burst         Maximum peer transport burst size.
# autoconnect   Probe and reconnect to configured peers automatically.
# reconnect_ms  Delay between automatic reconnect attempts.
#
# Local cluster default: enable query fan-out to node2. Benchmark searches use
# distributed=off so local throughput measurements remain isolated.

<distributed_search
     enabled="true"
     mode="local_first"
     prefer_local="true"
     timeout_ms="250"
     persistent="true"
     burst="64"
     autoconnect="true"
     reconnect_ms="100">
