# DISTRIBUTED LINKS - primary node (001 / 9200)
#
# 2nd (9201) participates in distributed search.
# 3rd (9202) is the replication slave for writes from this primary.

<node
     host="127.0.0.1"
     port="9201"
     role="distributed"
     passwd="local-dev-cluster-token">

<node
     host="127.0.0.1"
     port="9202"
     role="replica"
     passwd="local-dev-cluster-token">

<replication
     enabled="true"
     mode="sync_one"
     timeout_ms="2000">

<distributed_search
     enabled="true"
     mode="local_first"
     prefer_local="true"
     timeout_ms="250"
     persistent="true"
     burst="64"
     autoconnect="true"
     reconnect_ms="100">
