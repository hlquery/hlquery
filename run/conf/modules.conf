# Runtime-loadable modules
#
# Purpose of this file:
# This file tells hlquery which optional runtime modules should be loaded
# during startup, and how each loaded module should be configured.
#
# Modules extend server behavior without hardwiring everything into the core.
# Examples in this file:
# analytics   -> exports search/write/request activity to an external endpoint
# autodeleter -> periodically removes expired old documents
# banned      -> stores and manages banned-word entries through module routes
# query_enhancer -> unified post-search weighting + affinity enhancer
# debug       -> verbose debug module for development only
# event       -> stores internal daily event documents for searches and collection changes
#
# How module loading works:
# Each line like:
# <module name="analytics">
# tells hlquery to load a shared library named:
# run/modules/m_analytics.so
#
# The loader uses the pattern:
# m_<name>.so
# so:
# analytics   -> m_analytics.so
# autodeleter -> m_autodeleter.so
# banned      -> m_banned.so
# query_enhancer -> m_query_enhancer.so
# debug       -> m_debug.so
# event       -> m_event.so
#

# Important:
# 1. The <module name="..."> tag selects which module to load.
# 2. add or remove one <module ...> line to turn a module on or off.
# 3. path="/full/path/to/module.so" can override automatic module path lookup.
# 4. The matching configuration block, such as <analytics ...>, provides
#    module-specific settings read by that module at startup.
# 5. If a module is loaded but has no matching config block, the module may
#    still start and fall back to its internal defaults.
# 6. If a module is not loaded, its config block is ignored.
#
# ----------------------------------------------------------------------
# DEBUG MODULE
# ----------------------------------------------------------------------
# Development-only verbose debug module.
# This is usually kept disabled in production.
#

#<module name="debug">

# ----------------------------------------------------------------------
# DUMP MODULE
# ----------------------------------------------------------------------
# Dumps this module's key/value storage to stdout for inspection.
#
# Enables the CLI `module dump` helper populated by the new timers/core module.
#
# Uncomment the line below to enable it on startup:

#<module name="dump">

# ----------------------------------------------------------------------
# EVENT MODULE
# ----------------------------------------------------------------------
# Stores internal event documents directly inside hlquery.
# It creates day-bucketed collections such as events-2026-05-07 and records:
# - collection creation
# - collection deletion
# - searches
#
# This is enabled by default so event collections are written automatically.

#<module name="event">

<event prefix="events-" search_prefix="searches-" batch_size="16">

# ----------------------------------------------------------------------
# DEMO MODULE
# ----------------------------------------------------------------------
# Blocks mutating routes while keeping search and browsing available.
# Load this module when you want a public demo server that still shows write
# buttons in clients such as hanalyzer, but rejects create/update/delete calls.
#
# Uncomment to load it:
#
#<module name="demo">

# ----------------------------------------------------------------------
# BANNED MODULE
# ----------------------------------------------------------------------
# Stores a module-owned list of banned words inside the shared storage engine.
# Use it through the generic module CLI command surface.
#
# CLI examples:
# hlquery-cli module banned status
# hlquery-cli module banned list all
# hlquery-cli module banned add col poo
# hlquery-cli module banned add doc danger
# hlquery-cli module banned del alias legacy
#
# Uncomment to load it:
#

#<module name="banned">

# ----------------------------------------------------------------------
# LANG MODULE
# ----------------------------------------------------------------------
# Stores per-collection language metadata under the reserved "_lang" key.
# Language metadata is particularly useful when you know the collection language
# already and want to improve stopword handling, stemming, or translation hints.
#
# CLI examples:
# hlquery-cli module lang status
# hlquery-cli module lang get books
# hlquery-cli module lang set books en
#
# Uncomment the line below to enable it on startup:

#<module name="lang">

# ----------------------------------------------------------------------
# QUERY_ENHANCER MODULE
# ----------------------------------------------------------------------
# Unified module for both document weighting and query affinity boosting.
# Works for lexical, vector, and hybrid ranking modes. Use algo="all" (or leave
# empty) to apply a rule across all ranking modes, or target specific ranking
# strategies by listing "lexical" or "vector" per rule. Rules can boost entire
# operations, collections, keywords, or query terms (affinity rules work best for
# short, brand-heavy inputs).
#
# CLI examples:
# hlquery-cli module query_enhancer status
# hlquery-cli module query_enhancer set boost_cpp cpp 1.5 content books all
# hlquery-cli module query_enhancer set_affinity nike_brand nike nike 1.8 brand products all
# hlquery-cli module query_enhancer set_target laptop_gaming laptop category gaming 1.4 products all
# hlquery-cli module query_enhancer list
#
# Uncomment to load it:
# <module name="query_enhancer">
#
# Optional module settings:
# <query_enhancer
#      max_rules="4096"
#      max_pattern_length="256"
#      min_multiplier="0.05"

# ----------------------------------------------------------------------
# RATE LIMIT MODULE
# ----------------------------------------------------------------------
# Limits configured operations, collections, and IP ranges with per-minute buckets.
# Excess traffic receives HTTP 429 / Code::RATE_LIMIT_EXCEEDED.
# Use `<ratelimit_rule>` entries to cover different groups of APIs (writes, admin,
# batch imports, etc.) and `<ratelimit_exception>` entries to keep trusted hosts
# like local development machines unharmed.
#
# CLI helpers: `hlquery-cli module ratelimit status|rules|exceptions`.
#
# Uncomment to load it:
# <module name="ratelimit">
# <ratelimit limit_per_minute="120" window_seconds="60">
# <ratelimit_rule name="document-writes" limit_per_minute="120" window_seconds="60" operations="AddDocument,UpdateDocument,DeleteDocument,BulkImportDocuments" />
# <ratelimit_rule name="admin" limit_per_minute="10" window_seconds="60" operations="CreateUser,DeleteUser,CreateKey,DeleteKey,Flush,Repair" />
# <ratelimit_rule name="bulk-insert" limit_per_minute="30" window_seconds="120" operations="BulkImportDocuments" collections="reports" />
# <ratelimit_exception description="Local dev machines" ips="localhost,127.0.0.1,::1" />
# <ratelimit_exception description="Internal VPN" ips="192.168.0.0/16" />

# ----------------------------------------------------------------------
# ANALYTICS MODULE
# ----------------------------------------------------------------------
# Loads the analytics runtime module.
# When enabled, hlquery can forward request/search/write analytics events to
# an external HTTP or HTTPS collector service.
#
# This tag only loads the module binary:
# <module name="analytics">
#
# The actual runtime behavior is controlled by the <analytics ...> block below.

#<module name="analytics">

# Analytics configuration block
#
# Tag meaning:
# <analytics ...>
# starts the analytics module settings block. Every attribute inside this tag
# is read by the analytics module during startup.
#
# Attribute details:
# endpoint
# Full HTTP/HTTPS destination that receives analytics batches.
# Example:
# endpoint="http://127.0.0.1:8089/v1/analytics/hlquery"
# The module will POST analytics data to this URL.
#
# api_token
# Optional authentication token sent to the remote endpoint as:
# X-API-Key: <token>
# Use this when your analytics receiver requires authentication.
#
# flush_interval
# Interval, in seconds, between batch flushes to the remote endpoint.
# Example:
# flush_interval="10"
# means the module attempts to send queued analytics every 10 seconds.
# Larger values reduce request volume but increase delay before data is sent.
#
# connect_timeout_ms
# Network connection timeout in milliseconds for outbound analytics requests.
# Example:
# connect_timeout_ms="5000"
# means the module will wait up to 5 seconds when establishing the connection.
#
# Behavioral notes:
# - Loaded modules are active automatically after startup succeeds.
# - The analytics module batches events before sending them.
# - Read/write tracking defaults are handled inside the module implementation.

<analytics
     endpoint="http://127.0.0.1:8089/v1/analytics/hlquery"
     api_token="$y$j9T$iADGdzKzhDqTbvV0fWh5t"
     flush_interval="10"
     connect_timeout_ms="5000">

# ----------------------------------------------------------------------
# AUTODELETER MODULE
# ----------------------------------------------------------------------
# Loads the autodeleter runtime module.
# This module periodically scans documents and removes ones considered expired
# according to the configured retention policy.
#
# This is useful when documents carry timestamps and you want automatic data
# cleanup without running a separate external job.

#<module name="autodeleter">

# Autodeleter configuration block
#
# Tag meaning:
# <autodeleter ...>
# starts the autodeleter module settings block.
#
# Attribute details:
# retention_time
# Retention window before a document becomes eligible for deletion.
# You can still use a plain number for backward compatibility; plain numbers
# are treated as days.
# Legacy alias: retention_days
# Supported suffix letters:
# s = seconds
# m = minutes
# h = hours
# d = days
# w = weeks
# y = years
# Example:
# retention_time="3s"
# means documents older than 3 seconds may be removed.
# Example:
# retention_time="2w"
# means documents older than 2 weeks may be removed.
#
# delete_batch_size
# Maximum number of expired document IDs grouped into one deletion pass
# before the module flushes that batch internally.
# Example:
# delete_batch_size="256"
# means the module processes deletions in chunks of up to 256 documents.
# Larger values can improve throughput, while smaller values reduce burst size.
# Legacy alias: batch_size
# 
# delete_scope
# Controls what the module deletes after it finds expired data.
# Allowed values:
# "docs"                  -> delete expired documents only
# "docs_and_collections"  -> delete expired documents, then remove collections
#                            that no longer contain any non-expired documents
# "collections"           -> delete whole collections when every document in the
#                            collection is expired
# If omitted, the default is "docs".
#
# Operational notes:
# - The module runs from periodic server callbacks, not from a separate cron.
# - The module only removes documents that satisfy its expiration logic.
# - The module runs while loaded; omit it from the list to disable it.

<autodeleter
     retention_time="10m"
     delete_batch_size="10"
     delete_scope="collections">
