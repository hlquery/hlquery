#############################################################################
#
# SECONDARY ASSISTANT MANAGER (SAM)
#
# SAM log target:
# Captures SAM rebuild/indexing flow and, when enabled, the per-document
# context payload used by `sam run`. Relative targets resolve under the
# configured log dir (`run/logs`).
#
# Keep this log enabled while SAM is enabled; lower `level` to normal if debug
# output is too noisy.
#

<log
     method="file"
     type="sam"
     level="debug"
     target="sam.log"
     rotate_size="10MB"
     rotate_interval="daily"
     max_rotated_files="7"
     max_age_days="7">

# SAM keeps a secondary intent index beside the main search index. It can:
# - build alternate query phrases from document context
# - learn from recorded search ideas and document interactions
# - use a local LLM to expand document descriptions into searchable intent
# - blend SAM matches back into search ranking through SAM 2.5 scoring
#
# Paths in this file are resolved the same way as other run/conf includes.
# `data_dir="data/sam"` resolves under the runtime data directory, separate
# from the main RocksDB data directory.
#
# Core switches:
# enabled
#   Master switch. false disables SAM startup, indexing, learning, and lookup.
# index_all
#   When true, the core SAM module queues collections for background indexing
#   when they have documents but no completed SAM index state.
# auto_detect_collection_language
#   When false, hlquery does not infer and write collection `_lang` metadata
#   from document text. Explicit document language fields and existing
#   collection metadata are still honored.
# smart_sam / background_improvements
#   Enable low-priority background learning and improvement passes. The
#   `core_sam` module also runs a bounded full improvement pass every minute.
#   Both names are accepted by the parser; this config uses `smart_sam`.
# live_query_improvement
#   Run a bounded local Qwen intent pass for multi-token SAM searches and merge
#   confident document matches into the current response. This adds query
#   latency, so disable it when low latency matters more than semantic recall.
#
# Local LLM:
# models_dir
#   Directory containing GGUF files or model presets. `run/models` points at
#   the repo-level model cache in the default development layout.
# auto_find
#   When true and no model_file, model_path, or model_name is configured, use
#   the first GGUF file in models_dir after sorting filenames.
# model_name
#   Preset model name from the built-in catalog. Use `model_file` instead when
#   you want to pin a specific GGUF file.
# sam_llm_max_ideas
#   Max LLM-generated ideas kept per document. Higher values improve recall but
#   increase indexing time and storage.
# sam_context_max_ideas
#   Max total contextual ideas kept per document, including heuristic phrases
#   and LLM ideas.
# sam_llm_timeout_ms
#   Time limit for one local inference call. A timeout lets `sam run` continue
#   instead of waiting forever on a stuck subprocess.
# sam_llm_creativity_mode
#   conservative: stay close to source text.
#   balanced: modest expansion.
#   creative: broader query-intent expansion. Valid values are conservative,
#   balanced, and creative.
#
# Search idea and interaction learning:
# sam_search_ideas
#   Optional collection name whose live searches are recorded as learning
#   signals. Empty disables collection-specific search-idea recording. `SAMID`
#   is accepted as a legacy alias.
# record_search_ideas / record_interactions
#   Optional booleans, default true, for disabling either learning stream.
# search_idea_dedupe_window_ms / interaction_dedupe_window_ms
#   Optional dedupe windows. 0 means no time-window dedupe.
# search_idea_retention_days
#   Remove ordinary search ideas after this many inactive days. 0 disables
#   age-based cleanup. Default: 30.
# interaction_idea_retention_days
#   Keep query-to-document ideas reinforced by explicit opens longer before
#   pruning them. 0 disables age-based cleanup. Default: 180.
# actor_metadata_retention_days
#   How long in-memory actor metadata is retained for dedupe/rate-limit checks.
# interaction_max_per_minute
# interaction_max_per_hour
# interaction_max_per_doc_query_per_hour
#   Caps for recorded interaction signals. 0 means unlimited. Use these to
#   reduce the effect of mass-open or spoofed feedback.
#
# Background timing:
# background_improvement_poll_ms
#   How often an idle SAM worker checks for improvement work.
# background_improvement_interval_ms
#   Minimum interval between repeated background improvement passes for the
#   same collection. Improvement passes also review low-confidence generated
#   query/descriptor terms. After sufficient lookup traffic and a probation
#   window, unused generated terms are removed while source-backed terms are
#   retained.
#
# SAM 2.5 scoring:
# sam25_dynamic_query_weight
#   Let short queries lean more on phrase/order and longer queries lean more on
#   broader term coverage.
# sam25_short_query_phrase_boost / sam25_long_query_phrase_boost
#   Phrase boost used by short and long queries.
# sam25_source_phrase_boost_title / label_pair / label / llm
#   Source-quality multipliers for exact phrase evidence. Title and paired
#   labels usually deserve more trust than LLM-derived ideas.
# sam25_enable_idf, sam25_idf_floor, sam25_idf_ceiling
#   Boost rarer SAM terms and cap the multiplier so rare terms do not dominate.
# sam25_enable_doc_prior, sam25_doc_prior_field, sam25_doc_prior_weight
#   Blend a numeric document field, such as popularity_score, into final score.
# sam25_ordered_slop / sam25_unordered_window_slop
#   Control phrase looseness. Larger values match less exact word order/window.
# sam25_exact_phrase_requires_stopwords
#   Keep internal glue words significant when matching exact phrases.
# sam25_exact_phrase_ignore_outer_stopwords
#   Trim leading/trailing glue words before exact phrase scoring.
# sam25_require_exact_identifier_tokens
#   Require mixed letter-digit query tokens, such as XG04E, to exist literally
#   in the stored source document. This prevents semantic or typo expansion
#   from turning identifier lookups into nearby-code matches.
# sam25_enable_synonym_expansion, sam25_synonym_boost, sam25_max_synonyms_per_token
#   Use configured synonyms as bounded equivalent matches during scoring.
# sam25_enable_noise_penalty, sam25_noise_penalty, sam25_noise_penalty_llm_extra
#   Penalize generic or weak SAM terms; apply extra penalty to LLM-derived terms.
# sam25_min_coverage
#   Minimum query-token coverage required for a SAM candidate.
# sam25_min_ordered_boost_for_phrase
#   Minimum ordered-match contribution before phrase evidence is trusted.
# sam25_min_final_score
#   Final candidate score floor.
# sam25_intent_doc_match_min_score
#   Score floor when matching learned search-intent ideas to documents.
# sam25_enable_source_doc_merge and sam25_source_doc_* weights
#   Merge evidence from the source document itself, weighting title,
#   description, labels, and content separately.
# sam25_debug_explain / sam25_debug_log_top_k / sam25_debug_include_components
#   Debug logging controls. Enable only while tuning because logs can become
#   noisy. `sam_log_context` writes full per-document SAM context to sam.log.
#
#############################################################################

<sam enabled="false"
     models_dir="run/models"
     auto_find="yes"
     model_file="Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
     data_dir="data/sam"
     index_all="true"
     auto_detect_collection_language="false"
     smart_sam="true"
     live_query_improvement="true"
     background_improvement_poll_ms="15000"
     background_improvement_interval_ms="60000"
     sam25_dynamic_query_weight="true"
     sam25_short_query_phrase_boost="1.35"
     sam25_long_query_phrase_boost="0.95"
     sam25_source_phrase_boost_title="1.55"
     sam25_source_phrase_boost_label_pair="1.28"
     sam25_source_phrase_boost_label="1.10"
     sam25_source_phrase_boost_llm="0.72"
     sam_llm_max_ideas="12"
     sam_context_max_ideas="18"
     sam_log_context="false"
     sam_llm_timeout_ms="60000"
     sam_llm_creativity_mode="balanced"
     search_idea_retention_days="30"
     interaction_idea_retention_days="180"
     actor_metadata_retention_days="30"
     interaction_max_per_minute="0"
     interaction_max_per_hour="0"
     interaction_max_per_doc_query_per_hour="0"
     sam_search_ideas=""
     sam25_enable_idf="true"
     sam25_idf_floor="0.15"
     sam25_idf_ceiling="3.00"
     sam25_enable_doc_prior="false"
     sam25_doc_prior_field="popularity_score"
     sam25_doc_prior_weight="0.08"
     sam25_ordered_slop="1"
     sam25_unordered_window_slop="2"
     sam25_exact_phrase_requires_stopwords="true"
     sam25_exact_phrase_ignore_outer_stopwords="true"
     sam25_require_exact_identifier_tokens="true"
     sam25_enable_synonym_expansion="true"
     sam25_synonym_boost="0.60"
     sam25_max_synonyms_per_token="3"
     sam25_enable_noise_penalty="true"
     sam25_noise_penalty="0.24"
     sam25_noise_penalty_llm_extra="0.18"
     sam25_min_coverage="0.62"
     sam25_min_ordered_boost_for_phrase="0.28"
     sam25_min_final_score="0.48"
     sam25_intent_doc_match_min_score="0.72"
     sam25_enable_source_doc_merge="true"
     sam25_source_doc_weight="1.05"
     sam25_source_doc_title_weight="1.45"
     sam25_source_doc_description_weight="1.15"
     sam25_source_doc_labels_weight="1.20"
     sam25_source_doc_content_weight="0.86"
     sam25_source_doc_min_score="0.45"
     sam25_source_doc_merge_bonus="0.14"
     sam25_debug_explain="false"
     sam25_debug_log_top_k="10"
     sam25_debug_include_components="true">
